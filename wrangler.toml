name = "rss-translator"
main = "src/worker.ts"
compatibility_date = "2024-04-01"

# ================================================================
# [instabox] 定时任务由 CF Worker cron 触发 instabox box 执行。
#   Box 是唯一解析/翻译执行者；Worker 的 scheduled 只触发唤醒请求。
# ================================================================
[triggers]
# 每 3 小时触发一次。频率过高会让 box 长期处于运行状态（每次唤醒重置空闲计时），
# 累计运行时段很快撞上免费计划 480 分钟上限而被强制休眠。
# 改为 3 小时后，唤醒 → 跑完 → 空闲 30 分钟自动暂停，不再持续计时。
crons = ["0 */3 * * *"]

[vars]
LOG_LEVEL = "info"
# INSTABOX_WAKE_URL / INSTABOX_BOX_URL 用 secret 存放（不在 wrangler.toml 里，避免进仓库；
# 且 secret 不会被 wrangler deploy 的 [vars] 同步覆盖）：
#   npx wrangler secret put INSTABOX_WAKE_URL   # 值：https://<box-url>/run
#   npx wrangler secret put INSTABOX_BOX_URL    # 值：https://<box-url>
# 注：它们只是 URL 不是凭证，但 box 公网地址不想公开，放 secret 亦可。
# 注意：不要同时把它写在 [vars] 里，否则部署会以 var 形式重新覆盖 secret。

[[kv_namespaces]]
binding = "RSS_CONFIG"
id = "e47f4fc3903443f6bc8e359928ab5b5c"

[[kv_namespaces]]
binding = "RSS_CACHE"
id = "df144d8668a14e7c92da5c1545957c6d"

[observability.logs]
enabled = true
invocation_logs = true
