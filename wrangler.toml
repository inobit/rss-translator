name = "rss-translator"
main = "src/worker.ts"
compatibility_date = "2024-04-01"

# ================================================================
# [instabox] 定时任务由 CF Worker cron 触发 instabox box 执行。
#   Box 是唯一解析/翻译执行者；Worker 的 scheduled 只触发唤醒请求。
# ================================================================
[triggers]
crons = ["*/10 * * * *"]

[vars]
LOG_LEVEL = "info"
# instabox box 地址（转发 + 唤醒）。必须写在这里：wrangler deploy 会以 [vars] 完整替换
# Worker 的普通变量，Dashboard 手动加的 plain var 会在下次部署时被清掉。
INSTABOX_WAKE_URL = "<BOX_URL>/run"
INSTABOX_BOX_URL = "<BOX_URL>"
# 注：INSTABOX_TOKEN 是 secret（Dashboard 设置或 npx wrangler secret put INSTABOX_TOKEN），
# secret 不会被部署覆盖。

[[kv_namespaces]]
binding = "RSS_CONFIG"
id = "e47f4fc3903443f6bc8e359928ab5b5c"

[[kv_namespaces]]
binding = "RSS_CACHE"
id = "df144d8668a14e7c92da5c1545957c6d"

[observability.logs]
enabled = true
invocation_logs = true
