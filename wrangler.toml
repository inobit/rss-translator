name = "rss-translator"
main = "src/worker.ts"
compatibility_date = "2024-04-01"

# ================================================================
# [instabox] 定时任务由 CF Worker cron 触发 instabox box 执行。
#   Box 是唯一解析/翻译执行者；Worker 的 scheduled 只触发唤醒请求。
# ================================================================
[triggers]
crons = ["*/10 * * * *"]

[vars]
LOG_LEVEL = "info"
# INSTABOX_WAKE_URL / INSTABOX_BOX_URL 由 Cloudflare Dashboard 管理（不写入 wrangler.toml，
# 避免每次部署覆盖 Dashboard 上设置的值）。
#   INSTABOX_WAKE_URL = https://<box-public-url>/run
#   INSTABOX_BOX_URL  = https://<box-public-url>
# 注：INSTABOX_TOKEN 是 secret（Dashboard 设置或 npx wrangler secret put INSTABOX_TOKEN）

[[kv_namespaces]]
binding = "RSS_CONFIG"
id = "e47f4fc3903443f6bc8e359928ab5b5c"

[[kv_namespaces]]
binding = "RSS_CACHE"
id = "df144d8668a14e7c92da5c1545957c6d"

[observability.logs]
enabled = true
invocation_logs = true
