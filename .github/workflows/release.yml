name: Release Box Server

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # 手动触发仅用于重新部署，不创建 Release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # tag push = 发布 + 部署；手动触发 = 仅部署当前分支的构建产物
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
      INSTABOX_BOX: ${{ vars.INSTABOX_BOX || 'general' }}
      BOX_DIR: /data/home/rss-translator
      INSTABOX_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version consistency
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: tag is v$TAG_VERSION but package.json is $PKG_VERSION"
            exit 1
          fi
          echo "✅ Version consistency check passed: v$TAG_VERSION"

      - name: Build box bundle
        run: pnpm build:box

      - name: Create release package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release/rss-box-server
          cp -r dist-box release/rss-box-server/
          cp Dockerfile docker-compose.yml .env.example release/rss-box-server/
          cat > release/rss-box-server/README.txt << 'EOF'
          RSS Translator ${GITHUB_REF_NAME} — box server 部署包
          ====================================================
          本包只含 box 运行所需的预构建产物与编排文件：不需要源码，也不需要在
          box 内编译。Worker 由仓库源码通过 `wrangler deploy` 或 Git 集成部署，
          不在本包内。

          目录结构：
            dist-box/box-server.js   自包含产物（vite SSR 打包，仅外置 node 内置模块）
            Dockerfile               镜像只 COPY dist-box
            docker-compose.yml       编排（env_file: .env）
            .env.example             环境变量模板

          部署步骤：
          1. 创建 box（首次）：
               instabox create --name general --user inobit

          2. 把本包内容放到 box 的部署目录（默认 /data/home/rss-translator）：
               tar -czf - . | instabox exec general --stdin -- \
                 'mkdir -p /data/home/rss-translator && tar -xzf - -C /data/home/rss-translator'

          3. 创建 .env（参考 .env.example）：
               CLOUDFLARE_ACCOUNT_ID / CF_KV_API_TOKEN /
               CF_KV_CONFIG_ID / CF_KV_CACHE_ID /
               INSTABOX_TOKEN / INSTABOX_PORT=8788 / <PROVIDER>_API_KEY

          4. 启动：
               instabox exec general -- 'cd /data/home/rss-translator && docker compose up -d --build'

          5. 暴露端口并取得公网地址：
               instabox port publish general 8788

          6. 验证：
               instabox exec general -- 'curl -s http://127.0.0.1:8788/health'

          查看日志：
               instabox exec general -- 'docker logs rss-instabox -f'

          注意：
          - CF_KV_API_TOKEN 需在 Cloudflare Dashboard 创建自定义 API Token，
            权限 Developer Platform → Workers KV Storage → Edit，
            Account Resources 选账户或具体 namespace（限定到某个 Worker 会没有 KV 权限）。
          - 改了 .env 后要用 `docker compose up -d` 重建容器（`restart` 不会重读 env_file）。
          EOF
          cd release
          tar -czf rss-box-server-${GITHUB_REF_NAME}.tar.gz rss-box-server

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/rss-box-server-*.tar.gz
          generate_release_notes: true

      # 以下把同一次构建产物直接推到 box；.env 保留 box 上已有的，不覆盖
      - name: Install instabox CLI
        run: npm i -g instabox@0.8.306

      - name: Wake box
        # wake 只恢复自动暂停的 box；手动 stop 的用 start 兜底
        run: instabox wake "$INSTABOX_BOX" || instabox start "$INSTABOX_BOX"

      - name: Upload box bundle
        run: |
          tar -czf - dist-box Dockerfile docker-compose.yml \
            | instabox exec "$INSTABOX_BOX" --stdin --env "BOX_DIR=$BOX_DIR" -- \
              'mkdir -p "$BOX_DIR" && tar -xzf - -C "$BOX_DIR"'

      - name: Restart box container
        run: |
          instabox exec "$INSTABOX_BOX" --env "BOX_DIR=$BOX_DIR" --timeout 600 -- \
            'cd "$BOX_DIR" && docker compose up -d --build'

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if instabox exec "$INSTABOX_BOX" -- 'curl -fsS http://127.0.0.1:8788/health'; then
              echo "box healthy"
              exit 0
            fi
            sleep 3
          done
          echo "::error::box health check failed"
          exit 1
