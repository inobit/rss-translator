name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version consistency
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: tag is v$TAG_VERSION but package.json is $PKG_VERSION"
            exit 1
          fi
          echo "✅ Version consistency check passed: v$TAG_VERSION"

      - name: Build box bundle
        run: pnpm build:box

      - name: Create release package
        run: |
          mkdir -p release/rss-translator
          cp -r dist-box release/rss-translator/
          cp Dockerfile docker-compose.yml .env.example release/rss-translator/
          cat > release/rss-translator/README.txt << 'EOF'
          RSS Translator ${GITHUB_REF_NAME} — instabox box 部署包
          ======================================================
          本包含 box 运行所需的预构建产物与编排文件，不需要源码，也不需要
          在 box 内编译。Worker 部署请使用仓库源码（wrangler deploy 或 Git 集成）。

          目录结构：
            dist-box/box-server.js   自包含产物（vite SSR 打包，仅外置 node 内置模块）
            Dockerfile               镜像只 COPY dist-box
            docker-compose.yml       编排（env_file: .env）
            .env.example             环境变量模板

          快速开始：
          1. 创建 box：
               instabox create --name general --user inobit

          2. 把本包放到 box 的部署目录（默认 /data/home/rss-translator）：
               tar -czf - dist-box Dockerfile docker-compose.yml \
                 | instabox exec general --stdin -- \
                   'mkdir -p /data/home/rss-translator && tar -xzf - -C /data/home/rss-translator'

          3. 在该目录创建 .env（参考 .env.example）：
               CLOUDFLARE_ACCOUNT_ID / CF_KV_API_TOKEN /
               CF_KV_CONFIG_ID / CF_KV_CACHE_ID /
               INSTABOX_TOKEN / INSTABOX_PORT=8788 / <PROVIDER>_API_KEY

          4. 启动：
               instabox exec general -- 'cd /data/home/rss-translator && docker compose up -d --build'

          5. 暴露端口并取得公网地址：
               instabox port publish general 8788

          6. 验证：
               instabox exec general -- 'curl -s http://127.0.0.1:8788/health'

          查看日志：
               instabox exec general -- 'docker logs rss-instabox -f'

          说明：CF_KV_API_TOKEN 需在 Cloudflare Dashboard 创建自定义 API Token，
                权限为 Developer Platform → Workers KV Storage → Edit，
                Account Resources 选账户（不要限定到某个 Worker，否则无 KV 权限）。
          EOF
          cd release
          tar -czf rss-translator-${GITHUB_REF_NAME}.tar.gz rss-translator

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/rss-translator-*.tar.gz
          generate_release_notes: true
